<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог авто - Autobaar</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: #080b12;
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 50px;
            background: rgba(8, 11, 18, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .back-btn {
            color: #94a3b8;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .back-btn:hover {
            color: #00f2fe;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 30px;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .cars-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 30px;
        }

        .car-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .car-card:hover {
            border-color: rgba(79, 172, 254, 0.4);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
        }

        .slider-container {
            position: relative;
            width: 100%;
            height: 240px;
            overflow: hidden;
            background: #111827;
        }

        .car-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .car-img.active {
            display: block;
        }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(8, 11, 18, 0.7);
            color: #fff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            backdrop-filter: blur(5px);
            transition: background 0.3s;
            z-index: 5;
        }

        .slider-btn:hover {
            background: rgba(0, 242, 254, 0.9);
            color: #080b12;
        }

        .prev-btn { left: 10px; }
        .next-btn { right: 10px; }

        .photo-counter {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(5px);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            z-index: 5;
        }

        .car-details {
            padding: 25px;
        }

        .car-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .car-price {
            font-size: 1.3rem;
            font-weight: 900;
            color: #00f2fe;
            margin-bottom: 15px;
        }

        .car-specs {
            display: flex;
            justify-content: space-between;
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 15px;
        }

        .btn-details {
            display: block;
            width: 100%;
            padding: 12px;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-details:hover {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #080b12;
            border-color: transparent;
        }

        /* Модальне вікно */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90vh;
            border-radius: 12px;
            object-fit: contain;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            color: #fff;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            header { padding: 20px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="Autobaar.html" class="logo">Autobaar</a>
        <a href="Autobaar.html" class="back-btn">← На головну</a>
    </header>

    <div class="container">
        <h1 class="page-title">Доступні автомобілі</h1>

        <div class="cars-grid">
            
            <!-- Infiniti Q50S (файли 1.jpg.png - 10.jpg.png) -->
            <div class="car-card" id="q50-card">
                <div class="slider-container">
                    <button class="slider-btn prev-btn" onclick="changeSlide('q50-card', -1)">❮</button>
                    <button class="slider-btn next-btn" onclick="changeSlide('q50-card', 1)">❯</button>
                    <div class="photo-counter"><span class="current-index">1</span>/10</div>
                    
                    <img src="1.jpg.png" class="car-img active" alt="Infiniti">
                    <img src="2.jpg.png" class="car-img" alt="Infiniti">
                    <img src="3.jpg.png" class="car-img" alt="Infiniti">
                    <img src="4.jpg.png" class="car-img" alt="Infiniti">
                    <img src="5.jpg.png" class="car-img" alt="Infiniti">
                    <img src="6.jpg.png" class="car-img" alt="Infiniti">
                    <img src="7.jpg.png" class="car-img" alt="Infiniti">
                    <img src="8.jpg.png" class="car-img" alt="Infiniti">
                    <img src="9.jpg.png" class="car-img" alt="Infiniti">
                    <img src="10.jpg.png" class="car-img" alt="Infiniti">
                </div>
                <div class="car-details">
                    <h2 class="car-title">Infiniti Q50S 3.0tt</h2>
                    <div class="car-price">$18,200</div>
                    <div class="car-specs">
                        <span>2018 р.</span>
                        <span>83,000 км</span>
                        <span>3.0 Twin-Turbo</span>
                    </div>
                    <button class="btn-details" onclick="window.location.href='car-details.html?car=infiniti'">Переглянути</button>
                </div>
            </div>

            <!-- Audi A4 B9 (файли 11.jpg.png - 20.jpg.png) -->
            <div class="car-card" id="a4-card">
                <div class="slider-container">
                    <button class="slider-btn prev-btn" onclick="changeSlide('a4-card', -1)">❮</button>
                    <button class="slider-btn next-btn" onclick="changeSlide('a4-card', 1)">❯</button>
                    <div class="photo-counter"><span class="current-index">1</span>/10</div>
                    
                    <img src="11.jpg.png" class="car-img active" alt="Audi">
                    <img src="12.jpg.png" class="car-img" alt="Audi">
                    <img src="13.jpg.png" class="car-img" alt="Audi">
                    <img src="14.jpg.png" class="car-img" alt="Audi">
                    <img src="15.jpg.png" class="car-img" alt="Audi">
                    <img src="16.jpg.png" class="car-img" alt="Audi">
                    <img src="17.jpg.png" class="car-img" alt="Audi">
                    <img src="18.jpg.png" class="car-img" alt="Audi">
                    <img src="19.jpg.png" class="car-img" alt="Audi">
                    <img src="20.jpg.png" class="car-img" alt="Audi">
                </div>
                <div class="car-details">
                    <h2 class="car-title">Audi A4 B9 Quattro</h2>
                    <div class="car-price">$19,000</div>
                    <div class="car-specs">
                        <span>2018 р.</span>
                        <span>156,000 км</span>
                        <span>2.0 TFSI</span>
                    </div>
                    <button class="btn-details" onclick="window.location.href='car-details.html?car=audi'">Переглянути</button>
                </div>
            </div>

            <!-- Mazda 6 (файли 21.jpg.png - 30.jpg.png) -->
            <div class="car-card" id="mazda-card">
                <div class="slider-container">
                    <button class="slider-btn prev-btn" onclick="changeSlide('mazda-card', -1)">❮</button>
                    <button class="slider-btn next-btn" onclick="changeSlide('mazda-card', 1)">❯</button>
                    <div class="photo-counter"><span class="current-index">1</span>/10</div>
                    
                    <img src="21.jpg.png" class="car-img active" alt="Mazda">
                    <img src="22.jpg.png" class="car-img" alt="Mazda">
                    <img src="23.jpg.png" class="car-img" alt="Mazda">
                    <img src="24.jpg.png" class="car-img" alt="Mazda">
                    <img src="25.jpg.png" class="car-img" alt="Mazda">
                    <img src="26.jpg.png" class="car-img" alt="Mazda">
                    <img src="27.jpg.png" class="car-img" alt="Mazda">
                    <img src="28.jpg.png" class="car-img" alt="Mazda">
                    <img src="29.jpg.png" class="car-img" alt="Mazda">
                    <img src="30.jpg.png" class="car-img" alt="Mazda">
                </div>
                <div class="car-details">
                    <h2 class="car-title">Mazda 6</h2>
                    <div class="car-price">$4,750</div>
                    <div class="car-specs">
                        <span>2007 р.</span>
                        <span>253,000 км</span>
                        <span>2.0 Бензин</span>
                    </div>
                    <button class="btn-details" onclick="window.location.href='car-details.html?car=mazda'">Переглянути</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Модальне вікно -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="modalImg">
    </div>

    <script>
        function changeSlide(cardId, step) {
            const card = document.getElementById(cardId);
            const images = card.querySelectorAll('.car-img');
            const counter = card.querySelector('.current-index');
            
            let activeIndex = 0;
            images.forEach((img, index) => {
                if (img.classList.contains('active')) {
                    activeIndex = index;
                    img.classList.remove('active');
                }
            });

            let newIndex = activeIndex + step;
            if (newIndex >= images.length) newIndex = 0;
            if (newIndex < 0) newIndex = images.length - 1;

            images[newIndex].classList.add('active');
            counter.innerText = newIndex + 1;
        }

        function openModal(cardId) {
            const card = document.getElementById(cardId);
            const activeImg = card.querySelector('.car-img.active');
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            
            modal.style.display = "flex";
            modalImg.src = activeImg.src;
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = "none";
        }
    </script>
</body>
</html>
